[project]
name = "pyshoccs"
version = "0.1.0"
description = "Python array arm of the SHOCCS phase-1 thin waist: exported operator tables, heat system, parity checks"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pytest>=8.0",
]

[project.optional-dependencies]
# Optional array backends for bench/bench_heat.py. torch resolves to the CPU
# wheel through the extra index below; mlx is Apple-silicon only.
bench = [
    "torch>=2.2,<3",
    "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyshoccs"]

[tool.uv]
# CPU-only PyTorch wheels, as in scripts/stencil_gen/pyproject.toml. The
# unsafe-best-match strategy lets numpy and scipy resolve from PyPI although the
# torch index also publishes older versions of them.
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
testpaths = ["tests"]
